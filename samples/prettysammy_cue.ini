;魔法少女プリティーサミー！前編 CD-ROM版（CUE シートで遊ぶ）
;
; PC98PLAYER.INI（CD を CUE + BIN（IMG）で入れて、CD-DA の BGM も CD イメージから鳴らす）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   SAMY_A98.CUE と SAMY_A98.IMG（.BIN でもよい。CUE の中の FILE "..." の名前と合わせる）
;   AIC\SAMY\（インストールしてできたフォルダ）
;
; ■ Start= について
;   CD の INST.BAT（または INSTALL.EXE）でインストールすると、AIC\SAMY\SAMY.BAT ができる。
;   CD の GAME フォルダの中身を AIC\SAMY にコピーしてもよい。
;   バッチの中の MSCDEX の行は、そのままでよい（PC98PLAYER は MSCDEX を組み込みで持っているので飛ばす）。
;
; ■ 遊ぶとき
;   起動すると CD-ROM を確かめる（Q:\GAME\QUIZ.EXE を開く）ので、CDROM= の行は消さないこと。
;   BGM は CD-DA（43 トラック）。音量は CDDAVolume=、または F11 →「S: 画面＆サウンド設定」で。
;
; ■ 止まるときに記録を取る
;   下の ;Trace=1 の ; を取って起動し、止まったら 15 秒ほど待ってから終了する。
;   ゲームのフォルダにできる PC98PLAYER.LOG を送ってもらえると、止まった場所が分かる。
[PC98PLAYER]
Title=魔法少女プリティーサミー！前編
Start=AIC\SAMY\SAMY.BAT
CDROM=SAMY_A98.CUE
CDDrive=Q
SoundBoard=86
;Trace=1
;ExitOnEnd=0
