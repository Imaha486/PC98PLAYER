;紺碧の艦隊2 PERFECT CD-ROM版（インストール用）
;
; PC98PLAYER.INI（インストール用。終わったら konpeki2pf.ini の内容に書き換える）
;
; ■ 用意するもの（空のフォルダに、この INI と一緒に置く）
;   PC98PLAYER.EXE と、この INI（PC98PLAYER.INI という名前にする）
;   DBF2P.CUE と DBF2P.BIN（CD を CUE シートで吸い出したもの）
;   INSTALL-DISK.D88（インストール用フロッピーのイメージ。マニュアルどおり、こちらのインストーラを使う。
;                      CD からコピーしたあとに修正パッチを当ててくれる。名前が違えば FloppyDisk= を直す）
;
;   CUE で吸い出せないときは、CD の中身をフォルダ（例 CD）にコピーして、CDROM=CD にする。
;
; ■ 手順
;   1. PC98PLAYER.EXE を起動すると、フロッピーのインストーラ（INST_DOS.EXE）が動く
;   2. 「CDのドライブを入力してください」は Q のまま RETURN
;   3. 「インストール先ディレクトリ」は A:\KONPEKI2 のまま RETURN
;   4. 「インストールを始めますか？ [Y/N]」で Y
;      「ファイルをコピー中です...」のゲージは、コピーのあとの修正パッチの間ゆっくり進む。
;      最後まで 30 秒ほど（CpuMHz=16 のとき）。Shift+F12 を押している間は早送りになる
;      CD-ROM の装置名は AUTOEXEC.BAT（PC98PLAYER が用意する）から読まれ、
;      KONPEKI2\GAME.BAT が CD 版の起動（DEEP2CD /D:MSCD001）になる
;   5. 「インストールが終了しました。」と出たら、この INI を konpeki2pf.ini の内容に書き換えて、
;      F11 → R（または PC98PLAYER を起動し直す）
[PC98PLAYER]
Title=紺碧の艦隊2 PERFECT インストール
Drive=A
FloppyDrive=B
FloppyDisk=INSTALL-DISK.D88
Start=B:\INST_DOS.EXE
CDROM=DBF2P.CUE
CDDrive=Q
; インストーラがフロッピーに書き込まないように（ディスクイメージを守る）
FloppyWriteProtect=1
ExitOnEnd=0
