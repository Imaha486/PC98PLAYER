; PC98PLAYER.INI（スレイヤーズ！ / バンプレスト 1994。ハードディスクにインストールしたもの）
;
; ★ 起動時にディスク A（キーディスク）のプロテクトを確認するため、Greaseweazle が必須です。
;    普通の吸い出しツールや USB フロッピーで作ったイメージ（FDI・ベタ・プロテクトを記録できない D88）、
;    USB フロッピードライブの直結では、確認を通りません。
;
; ディスク A のイメージの作り方（最初に 1 回だけ）:
;   1. Greaseweazle と PC 用の FDD をつなぎ、ディスク A を入れる（Greaseweazle の公式ツールは閉じておく）
;   2. PC98PLAYER を起動して F11 → F →「Greaseweazle」を選ぶ
;   3. もう一度 F →「今のディスクを D88 で保存…」で SLAYERS_A.d88 として、このフォルダに保存する
;      （ID のずれたセクタ・CRC エラーなどプロテクトの情報も D88 に残る）
;   吸い出した D88 は、別の場所にもコピーを取っておくこと（上書きされるとプロテクトの情報は戻せない）。
;
; インストールは取扱説明書 第三章 3-9 の例（SLAYERS_B.d88 から INST.EXE B）を参照。
[PC98PLAYER]
Title=スレイヤーズ！
Start=SL.BAT
Drive=A
; キーディスク（ディスク A の D88）。Greaseweazle から毎回直接読むなら FloppyDisk=GW（見つからなければ GW:COM5 など）
FloppyDisk=SLAYERS_A.d88
FloppyDrive=B
; キーディスクの確認にしか使わないので、書き込み禁止にしてイメージを守る
FloppyWriteProtect=1
; Greaseweazle につないだドライブ（FloppyDisk=GW のときだけ使う。PC のケーブルの端 = A、真ん中 = B）
GWDrive=A
