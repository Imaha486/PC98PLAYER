;ぷよぷよ通（PC-9821 版 CD-ROM）
;
; PC98PLAYER.INI（puyo2_install.ini でインストールしたあとに使う）
;
; ■ フォルダの中身（PC98PLAYER.EXE と同じ場所）
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   PUYO2\                … インストーラが作ったフォルダ（PUYO2.BAT・PP2.COM など）
;   PUYO2.CUE と PUYO2.BIN … CD を CUE シートで吸い出したもの（CD-DA の曲もここから鳴る）
;
;   CD の中身をフォルダでコピーしたときは CDROM=CD にし、CD-DA のトラック 2・3 を MP3 などにして
;   フォルダ（例 cdda）に入れて CDDA=cdda を書く（下の ; の付いた行）。
;
; ■ 設定について
;   PUYO2.BAT が、FM 音源のドライバ・グラフィックのドライバなどを順に常駐させてからゲームを始める。
;   グラフィックのドライバは PC-9821 の 256 色の画面を使うので、PC9821=1 が要る
;   （無いと「２５６色モードを設定できませんでした。」と出て止まる）。
;   CpuMHz は 66 がおすすめ。33 だと背景が流れない場面がある（ゲームが遅い機械向けに演出を省くらしい）。
;   速くしすぎる（133 など）と、背景が流れる画面でパソコンの処理が追いつかず、重くなることがある。
;
; ■ 遊ぶとき
;   スペースでタイトルを進め、上下左右キーとリターンでモードを選ぶ。
;
; ■ 止まるときに記録を取る
;   下の ;Trace=1 の ; を取って起動し、止まったら 15 秒ほど待ってから終了する。
;   ゲームのフォルダにできる PC98PLAYER.LOG を送ってもらえると、止まった場所が分かる。
[PC98PLAYER]
Title=ぷよぷよ通
Start=PUYO2\PUYO2.BAT
CDROM=PUYO2.CUE
;CDROM=CD
;CDDA=cdda
CDDrive=Q
PC9821=1
SoundBoard=86
CpuMHz=66
;Trace=1
;ExitOnEnd=0
