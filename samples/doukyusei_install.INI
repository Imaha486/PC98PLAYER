; PC98PLAYER.INI（同級生 / elf 1992 のハードディスクインストール）
; 空のフォルダに NANPA1_A～I.d88 と一緒に置いて起動する。
; INSTALL.EXE は「カレントドライブ」にインストールし、カレントがハードディスクでないと
; 「カレントドライブがハードディスクドライブではありません」と止まる。実機で A> から B:INSTALL と
; 打つのと同じにするため、CurrentDirectory=A:\NANPA\（説明書どおりの A:\NANPA。無ければ作られる）をカレントにして B: の INSTALL.EXE を動かす。
; 実物のフロッピーなら FloppyDisk=FDD:A などにする。
; 「○ディスクをドライブ１に入れて下さい」と出たら、F11 の画面で B: のディスクを入れ替えて Enter。
; （A, B, C, D … I の順。最後に「終了しました」と出たら、下の起動用の INI に書き換える）
[PC98PLAYER]
Title=同級生 Install
Drive=A
FloppyDrive=B
FloppyDisk=NANPA1_C.d88
Start=B:\INSTALL.EXE
CurrentDirectory=A:\NANPA\
FloppyWriteProtect=1
ExitOnEnd=0
;
; インストールが終わったら、次の 3 行だけにする（ハードディスク版として起動）:
; [PC98PLAYER]
; Title=同級生
; Start=NANPA\NANPA.BAT
