; PC98PLAYER.INI（MIMPI V3.8 で MIDI ファイルを演奏する）
; MIMPIV3.EXE と曲（例: CANYON.MID）を同じフォルダに置く。Args= の /I で音源を選ぶ:
;   /I0 = MIDI（MPU-PC98）  /I3 = MIDI（RS-232C）  /I5 = FM 音源  /I8 = BEEP
;   省略すると MIDI（MIDI=1 のとき）→ FM（SoundBIOS=1 のとき）→ BEEP の順に選ぶ
[PC98PLAYER]
Title=MIMPI
Start=MIMPIV3.EXE
Args=/I5 CANYON.MID
SoundBoard=26
; FM 演奏はサウンド BIOS（INT D2h）を使う
SoundBIOS=1
; MIDI で鳴らすときは 1（Windows の MIDI 出力へ送る）
MIDI=1
ExitOnEnd=1
