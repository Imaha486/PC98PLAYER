; PC98PLAYER.INI（サバッシュII インストール用）
; 空のフォルダに ZAVAS2_1.D88 ～ ZAVAS2_6.D88 と一緒に置いて起動する。
; A: = このフォルダ（インストール先）、B: = フロッピー。Z2HD.BAT B: A: を実行する。
; 「～ディスクをドライブB:に入れて何かキーを押してください」と出たら、
; F11 → フロッピーの欄で求められたディスク（2:システムデータ 3:オープニング 4:西パル 5:東パルA 6:東パルB）にして Enter。
; 最後の「展開」には少し時間がかかる。終わったら zavas2.INI の内容に書き換える。
[PC98PLAYER]
Title=Zavas2 Install
Drive=A
FloppyDrive=B
FloppyDisk=ZAVAS2_1.D88
Start=B:\Z2HD.BAT
Args=B: A:
; インストーラがフロッピーに書き込まないように（ディスクイメージを守る）
FloppyWriteProtect=1
ExitOnEnd=0
