;紺碧の艦隊2 PERFECT CD-ROM版（実行用）
;
; PC98PLAYER.INI（遊ぶとき。先に konpeki2pf_install.ini でインストールしておく）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   DBF2P.CUE と DBF2P.BIN（遊ぶ間も CD のデータと CD-DA の BGM をここから読む）
;   KONPEKI2\（インストールしてできたフォルダ。GAME.BAT が「DEEP2CD /D:MSCD001」になっていること）
;
; ■ 遊ぶとき
;   マウスで操作する（最初の「画面モード」もマウスで選ぶ）。
;   起動すると CD-ROM の曲の数（17 トラック）を確かめるので、CDROM= の行は消さないこと
;   （無いと「CD-ROMが違います」で終わる）。
;   BGM は CD-DA。音量は CDDAVolume=、または F11 →「S: 画面＆サウンド設定」の「CD-DA（CD の音楽）」で。
;
; ■ CUE で吸い出せないとき
;   CD の中身をフォルダ（例 CD）にコピーして CDROM=CD とし、音楽トラックを WAV / MP3 / FLAC にして
;   フォルダ（例 BGM）に入れて、下の ;CDDA=BGM の ; を取る。ファイル名の最後の 2 桁がトラック番号
;   （例 track_02.mp3 ～ track_17.mp3。名前の前の部分は何でもよい）。02～17 をすべてそろえること。
;
; ■ GAME.BAT が「deep2」のままのとき（インストールのときに CD-ROM を入れていなかった など）
;   KONPEKI2\GAME.BAT の 2 行目を「DEEP2CD /D:MSCD001」に書き換える。
;   「deep2」は CD を使わない起動で、CD-DA の BGM は鳴らない。
[PC98PLAYER]
Title=紺碧の艦隊2 PERFECT
Start=KONPEKI2\GAME.BAT
CDROM=DBF2P.CUE
;CDDA=BGM
CDDrive=Q
SoundBoard=86
