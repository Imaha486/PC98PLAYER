; PC98PLAYER.INI（ファイル管理ツール FD for PC98 Ver.3.13 / 出射 厚 氏のフリーソフト）
;
; ■ 用意するもの（同じフォルダに置く）
;   FD.COM・FD98.COM・FD.CFG・FDCUST2.COM（FD98_313.LZH の中身）
;   FDEMS.COM（FDEMS101.LZH。コマンドとディレクトリの履歴を FDHIS.DAT に残す。無くても動く）
;   LHA.EXE など（圧縮ファイルの一覧・解凍・冷凍を使うとき）、VZ.COM などのエディタ（Editor を使うとき）
;   FDSTART.BAT（下の 4 行。samples フォルダの FDSTART.BAT をコピーしてもよい）
;       FDEMS -L FDHIS.DAT
;       FD
;       FDEMS -S FDHIS.DAT
;       FDEMS -D
;
; ■ 使える機能
;   ゲームのフォルダ（A:）: 一覧・ツリー・コピー・移動・削除・名前の変更・属性と日付の変更・
;     ディレクトリの作成と削除（中身ごと）・検索（Find）・ソート表示・View・実行（eXec）・
;     シェル（sHell。空のまま Enter で COMMAND.COM の画面になり、EXIT で FD に戻る）・
;     GRPH+A～Z の登録コマンド・履歴（FDEMS）
;   ゲームのフォルダはWindows のフォルダなので、FD はネットワークドライブと同じ扱いになり、
;   ソート結果の書き込み（Write）・削除ファイルの隙間詰めはできません（FD の説明書のとおり）。
;
; ■ ディスクの直接読み書き（Write・Sort の書き込み・Backup）を使うには
;   フロッピーイメージ（D88 / HDM / FDI など）を入れると、そのドライブでは FD のすべての機能が使えます。
;   Backup（フォーマット付きディスクコピー）は 2 台目のドライブ（FloppyDisk2=）にコピー先を入れます。
;   中身が 0 のファイル（1,261,568 バイト）を作って入れておけば、FD がフォーマットしてからコピーします。
;   ドライブの切り替えは FD の Logdsk（L キーで B: など）、イメージの入れ替えは F11 の画面で。
;
; ■ キー
;   GRPH は Windows の Alt キー（NFER・XFER でも可）。ROLL UP/DOWN は PageDown/PageUp、HELP は End です。
[PC98PLAYER]
Title=FD
Start=FDSTART.BAT
Drive=A
; 履歴（FDEMS）を EMS に置く
EMS=1
; Backup・Write 用のフロッピーイメージ（使わないなら空のまま）
FloppyDisk=
FloppyDrive=B
FloppyDisk2=
FloppyDrive2=C
; FD を終えたら窓を閉じる
ExitOnEnd=1
