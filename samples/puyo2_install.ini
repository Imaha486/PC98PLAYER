;ぷよぷよ通（PC-9821 版 CD-ROM）インストール用
;
; PC98PLAYER.INI（インストール用。終わったら puyo2.ini の内容に書き換える）
;
; ■ 用意するもの（空のフォルダに、この INI と一緒に置く）
;   PC98PLAYER.EXE と、この INI（PC98PLAYER.INI という名前にする）
;   PUYO2.CUE と PUYO2.BIN（CD を CUE シートで吸い出したもの）
;
;   CUE で吸い出せないときは、CD の中身をフォルダ（例 CD）にコピーして CDROM=CD にし、
;   CD-DA のトラック 2・3 を MP3 などにしてフォルダ（例 cdda）に入れて CDDA=cdda を書く
;   （下の ; の付いた行）。
;
; ■ 手順（キーボードの上下左右キーとリターンで選ぶ）
;   1. PC98PLAYER.EXE を起動すると、CD のインストーラ（INST98.EXE）が動く。最初の画面は RETURN
;   2. 「インストール先を指定します。」
;        インストール先のドライブ = A、ディレクトリ = \PUYO2、起動ディスクの作成 = 作成しない のまま、
;        ↓で「変更完了」まで下りて RETURN
;   3. 「ぷよぷよ通の動作環境を設定します。」
;        サウンド = PC-9801-86・PC9801-26K ボード のまま、↓で「変更完了」まで下りて RETURN
;   4. 「インストールをはじめます。」で ← を押して「はじめる」を選び、RETURN
;   5. 「ぷよぷよ通のインストールがおわりました。」と出たら RETURN で DOS に戻る。
;      このフォルダに PUYO2 フォルダができている
;   6. この INI を puyo2.ini の内容に書き換えて、F11 → R（または PC98PLAYER を起動し直す）
;
; ■ 設定について
;   ゲームの画面は 256 色で、PC-9821 の BIOS を使う。PC9821=1 は消さないこと。
;   CpuMHz は 66 がおすすめ。33 だと背景が流れない場面がある（ゲームが遅い機械向けに演出を省くらしい）。
;   速くしすぎる（133 など）と、背景が流れる画面でパソコンの処理が追いつかず、重くなることがある。
[PC98PLAYER]
Title=ぷよぷよ通 インストール
Start=Q:\INST98.EXE
CDROM=PUYO2.CUE
;CDROM=CD
;CDDA=cdda
CDDrive=Q
PC9821=1
SoundBoard=86
CpuMHz=66
ExitOnEnd=0
