;PC-9821 のデモ CD（256 色のデモ）
;
; PC98PLAYER.INI（CD の CUE + BIN をゲームのフォルダに置いて動かす）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   9821DEMO.CUE と 9821DEMO.BIN（CUE の中の FILE "..." の名前と合わせる）
;
; ■ 動かすプログラム
;   Start= に CD の中のプログラムを書く（どれか 1 つ）。
;     Q:\AQUARIUM.EXE   水族館
;     Q:\DINOSAUR.EXE   進化と恐竜（マウスで操作）
;     Q:\CDPLAYER.EXE   CD プレーヤー（CD の音楽トラックを鳴らす）
;     Q:\CHKDEMO.EXE    ドライバの確認（何も表示せずに終わる）
;
; ■ 用意しなくてよいもの
;   AVGDRV.SYS（256 色のグラフィックドライバ）と AVSDRV.SYS（PCM ドライバ）は、
;   プログラムが開こうとしたときに PC98PLAYER が代わりのものを用意する。
;   CD-ROM は SCSI の CD ドライブとしても見せる（デモが直接 CD ドライブに命令を送るため）。
;
; ■ 注意
;   EMSFrame=C000 は、EMS のページフレームが C000h でないと
;   「EMS ドライバの設定が不正です」と言うプログラムがあるため。
[PC98PLAYER]
Title=PC-9821 デモ CD
Start=Q:\AQUARIUM.EXE
CDROM=9821DEMO.CUE
CDDrive=Q
SoundBoard=86
CpuMHz=66
EMSFrame=C000
;Trace=1
