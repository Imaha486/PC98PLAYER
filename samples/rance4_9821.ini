;ランス４ －教団の遺産－（PC-9821 の 256 色で遊ぶ）
;
; PC98PLAYER.INI（ゲームのフォルダ＝ハードディスクにインストールした RANCE4 のフォルダ）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）、R4_9821.BAT（サンプルに同梱）
;   RANCE4 のフォルダの中身（ADV.COM・AGS_9821.COM・DRI.COM・ACG.DAT など）
;   HDI から取り出すときは、PC98PLAYER のインストールアシスタントで展開し、
;   できた RANCE4 フォルダの中に PC98PLAYER.EXE とこの INI・R4_9821.BAT を置く。
;
; ■ ポイント
;   PC9821=1 で PC-9821 として見せる（AGS_9821.COM が「PC-9821 ではない」と言わないように）。
;   付属の RANCE4.BAT は起動メニュー（ALSMENU）が A:\ALSMENU.SCR やフロッピーを探すので、
;   メニューを通さない R4_9821.BAT（ゲームのマニュアルの「HDD インストール補助」の例と同じ）で始める。
;   16 色で遊ぶときは、R4_9821.BAT の ags_9821 を ags_16 にする（PC9821= は不要）。
[PC98PLAYER]
Title=ランス４
Start=R4_9821.BAT
SoundBoard=86
CpuMHz=33
PC9821=1
;Trace=1
