;魔法少女プリティーサミー！前編 CD-ROM版（データをフォルダ、BGM を MP3 にして遊ぶ）
;
; PC98PLAYER.INI（CD イメージ（約 700MB）の代わりに、データトラックの中身と MP3 にした BGM を使う。
;               全体で数十 MB になるので、持ち運びや受け渡しがしやすい）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   CD\       … データトラック（トラック 1）の中身（GAME\QUIZ.EXE などがあるフォルダ）
;   BGM\      … 音楽トラックの MP3。ファイル名の最後の 2 桁がトラック番号（track02.mp3 ～ track43.mp3）
;   AIC\SAMY\ … インストールしてできたフォルダ
;
; ■ CD\ と BGM\ の作り方（CUE + BIN（IMG）から）
;   PC98PLAYER のソース（_src.zip）の tools\cue2folder.py を使う（Python と、MP3 にするなら ffmpeg が要る）。
;     python cue2folder.py SAMY_A98.CUE 出力 --mp3
;   出力\TRACK01.ISO（データトラック）と 出力\BGM\track02.mp3 ～ track43.mp3 ができる。
;   TRACK01.ISO の中身を 7-Zip などで CD\ に取り出し、BGM\ はそのまま置く。
;   （CD\ を作らずに CDROM=TRACK01.ISO としてもよい。こちらのほうが元の CD に近い）
;
; ■ 元の CD との違い
;   フォルダの CD では、データトラックの長さを中身のファイルの合計から見積もるので、
;   トラックの位置（トラック表）が元の CD と少しずれる。トラック番号で曲を鳴らすゲームなら問題ない。
;   CUE で遊べてこちらで止まる、またはその逆なら、その違いを手掛かりに調べられる。
;
; ■ Start= について
;   CD の INST.BAT（または INSTALL.EXE）でインストールすると、AIC\SAMY\SAMY.BAT ができる。
;   CD の GAME フォルダの中身を AIC\SAMY にコピーしてもよい。
[PC98PLAYER]
Title=魔法少女プリティーサミー！前編
Start=AIC\SAMY\SAMY.BAT
CDROM=CD
CDDA=BGM
CDType=DATA
CDDrive=Q
SoundBoard=86
;Trace=1
;ExitOnEnd=0
