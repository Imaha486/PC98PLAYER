;英雄伝説4朱紅い雫CD-ROM版
;
; PC98PLAYER.INI（CD-ROM 版。CD から作った ISO イメージで遊ぶ）
;
; ■ 用意するもの（同じフォルダに置く）
;   PC98PLAYER.EXE と、この INI（PC98PLAYER.INI という名前にする）
;   ED4_98.ISO（CD から作った ISO イメージ。.BIN でも可。CD の中身をコピーしたフォルダでも可）
;
; ■ はじめに 1 回だけ: CD の中のインストーラでインストールする
;   1. 下の Start= を「Start=Q:\INSTALL.EXE」に書き換えて起動する
;   2. インストールするドライブは A を選ぶ（「ハードディスクではありません」「リモートドライブ」と
;      出ても、そのまま RETURN で進めてよい）。ディレクトリは A:\FALCOM\ED4_98 のままでよい
;   3. 終わったら Start= を「Start=FALCOM\ED4.BAT」に戻して、F11 → R で起動し直す
;
; ■ 遊ぶとき
;   ゲームは起動すると MSCDEX で CD-ROM ドライブ（Q:）を探し、絵や音のデータを CD から読みます。
;   そのため CDROM= の行は消さないでください（無いと「データディスクをセットしてください」で止まります）。
;   BGM は FM 音源で鳴ります（CD-DA は使っていません）。セーブデータは A:\FALCOM\ED4_98\SAVE に残ります。
[PC98PLAYER]
Title=英雄伝説IV 朱紅い雫（CD-ROM 版）
Start=FALCOM\ED4.BAT
CDROM=ED4_98.ISO
CDDrive=Q
SoundBoard=86
