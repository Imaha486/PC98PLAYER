;ポリスノーツ（PC-9821 版）
;
; PC98PLAYER.INI（CD の中身をフォルダで、CD-DA の曲を MP3 で入れる）
;
; ■ フォルダの中身（PC98PLAYER.EXE と同じ場所）
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   FD\   … システムディスク（フロッピー）の中のファイル全部（ITP.EXE・NAUTS.BAT・CONFIG.SYS など）
;   mp3\  … CD-DA のトラック 2～6（policenauts_02.mp3 ～ policenauts_06.mp3。名前の最後の 2 桁がトラック番号）
;   PAC\  … CD の PAC フォルダ
;   PCM\  … CD の PCM フォルダ（声・BGM・効果音の PNAUTS.PCM）
;
; ■ 設定について
;   CDROM=. で、このフォルダそのものを CD として見せる（中の PAC・PCM が CD の \PAC・\PCM になる）。
;   FD や mp3 も CD の中に見えるが、ゲームは \PAC と \PCM しか読まないのでかまわない。
;   PAC と PCM を「CD」というフォルダに入れたときは、CDROM=CD にする（こちらのほうが確実）。
;   CONFIG.SYS が FD フォルダの中にあって自動では見つからないので、AVSDRV=1 で PCM ドライバ
;   （AVSDRV.SYS の代わり）をいつも用意する。HIMEM.SYS・EMM386.EXE・NECCD.SYS・MSCDEX.EXE は要らない。
;
; ■ 遊ぶとき
;   マウスで遊ぶ。セーブは FD フォルダ（PNAUTS.SV0 など）にできる。
;   ゲームの途中でウインドウを閉じると、次の起動でタイトルに「非常復帰装置」が出る（ゲームの機能）。
;
; ■ 止まるときに記録を取る
;   下の ;Trace=1 の ; を取って起動し、止まったら 15 秒ほど待ってから終了する。
;   ゲームのフォルダにできる PC98PLAYER.LOG を送ってもらえると、止まった場所が分かる。
[PC98PLAYER]
Title=ポリスノーツ
Start=FD\NAUTS.BAT /Pq:\pac\ /C
CDROM=.
CDDrive=Q
CDDA=mp3
AVSDRV=1
SoundBoard=86
CpuMHz=66
;Trace=1
;ExitOnEnd=0
