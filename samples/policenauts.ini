;ポリスノーツ（PC-9821 版）
;
; PC98PLAYER.INI（システムディスクのファイルをゲームのフォルダに置き、CD を CUE + BIN で入れる）
;
; ■ フォルダの中身
;   PC98PLAYER.EXE、この INI（PC98PLAYER.INI という名前にする）
;   システムディスク（フロッピー）の中のファイル全部（ITP.EXE・NAUTS.BAT・CONFIG.SYS など）
;   POLICENAUTS.CUE と POLICENAUTS.BIN（CUE の中の FILE "..." の名前と合わせる）
;
; ■ 用意について
;   システムディスクに入っていない MS-DOS のファイル（HIMEM.SYS・EMM386.EXE・NECCD.SYS・
;   MSCDEX.EXE・PCM ドライバの AVSDRV.SYS）は要らない。どれも PC98PLAYER が代わりを持っている。
;   AVSDRV.SYS は、フォルダの CONFIG.SYS に DEVICE=A:\AVSDRV.SYS があれば代わりのものを用意する。
;   CONFIG.SYS を置かないときは、下の ;AVSDRV=1 の ; を取る。
;   フロッピーのイメージ（.D88 など）のまま使うときは、ファイルを取り出す代わりに
;     FloppyDisk=（イメージの名前）  FloppyDrive=A  Drive=C  AVSDRV=1
;   と書き、Start=A:\NAUTS.BAT /Pq:\pac\ /C にする。
;
; ■ CD について
;   CD-DA の BGM も CD イメージから鳴る。CD の中身をコピーしたフォルダ（PAC・PCM）を
;   CDROM= に書き、音楽トラックのファイル（track02.mp3 …）を CDDA= のフォルダに入れてもよい。
;   声（PCM フォルダの PNAUTS.PCM）も CD から読むので、CDROM= の行は消さないこと。
;
; ■ 遊ぶとき
;   マウスで遊ぶ。セーブはゲームのフォルダ（PNAUTS.SV0 など）にできる。
;   PC-9821 用のゲームなので、CpuMHz= は大きめにしておく（16 でも動く）。
;   ゲームの途中でウインドウを閉じると、次の起動でタイトルに「非常復帰装置」が出る（ゲームの機能）。
;
; ■ 止まるときに記録を取る
;   下の ;Trace=1 の ; を取って起動し、止まったら 15 秒ほど待ってから終了する。
;   ゲームのフォルダにできる PC98PLAYER.LOG を送ってもらえると、止まった場所が分かる。
[PC98PLAYER]
Title=ポリスノーツ
Start=NAUTS.BAT /Pq:\pac\ /C
CDROM=POLICENAUTS.CUE
CDDrive=Q
SoundBoard=86
CpuMHz=66
;AVSDRV=1
;Trace=1
;ExitOnEnd=0
