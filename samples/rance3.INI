; PC98PLAYER.INI (ランス３ -リーザス陥落-、アリスソフト 配布フリー版)
; フロッピー 2 台（A: と B:）＋ハードディスク（C: = ゲームのフォルダ）の形で、A ディスクから起動する。
; ゲームのフォルダに ADISK_GR.D88～FDISK.D88 を置く。B: のディスクの入れ替えは F11 → D（ドライブ切替）→ N
[PC98PLAYER]
Title=ランス３
Drive=C
FloppyDrive=A
FloppyDisk=ADISK_GR.D88
FloppyDrive2=B
FloppyDisk2=BDISK.D88
Start=A:\AUTOEXEC.BAT
